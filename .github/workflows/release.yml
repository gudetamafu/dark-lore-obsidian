# Makes a release of the version in manifest.json.
#
# Run it from the Actions tab: Release → Run workflow. It tags the commit with
# the manifest's version (Obsidian needs the tag and the version to match),
# attaches manifest.json and theme.css (what Obsidian downloads), and takes the
# release notes from that version's section of CHANGELOG.md.
# Pushing a version tag from a computer does the same.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json's version $version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Take the notes from CHANGELOG.md
        run: |
          awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section headed '## $VERSION'."
            exit 1
          fi

      - name: Make the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists. Raise the version in manifest.json first."
            exit 1
          fi
          gh release create "$VERSION" manifest.json theme.css \
            --target "$GITHUB_SHA" \
            --title "Dark Lore $VERSION" \
            --notes-file notes.md
